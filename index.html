<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniRealm - Hub Anime Premium dynamic</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            base: '#0B0B0E',
                            card: '#14141B',
                            hover: '#1E1E28',
                            border: '#282836'
                        },
                        amber: {
                            gold: '#FFB703',
                            accent: '#F59E0B',
                            glow: '#FFB70333'
                        },
                        purple: {
                            neon: '#9D4EDD',
                            glow: '#9D4EDD33'
                        }
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0B0B0E;
        }
        ::-webkit-scrollbar-thumb {
            background: #282836;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #FFB703;
        }
        .hero-gradient {
            background: linear-gradient(180deg, rgba(11, 11, 14, 0.2) 0%, rgba(11, 11, 14, 0.8) 70%, #0B0B0E 100%);
        }
        .gold-glow {
            box-shadow: 0 0 25px rgba(255, 183, 3, 0.25);
        }
        .card-glow:hover {
            box-shadow: 0 10px 30px -10px rgba(255, 183, 3, 0.2);
        }
        /* Hide scrollbars for clean filter rows */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-dark-base text-gray-200 font-sans min-h-screen flex flex-col selection:bg-amber-gold selection:text-black">

    <!-- HEADER / NAVIGATION -->
    <header class="sticky top-0 z-40 bg-dark-base/90 backdrop-blur-md border-b border-dark-border transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <!-- Logo -->
                <div class="flex items-center gap-3 cursor-pointer" onclick="resetToTop()">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-gold to-purple-neon flex items-center justify-center text-black font-extrabold text-xl shadow-lg shadow-amber-gold/20">
                        ⛩️
                    </div>
                    <span class="text-2xl font-black tracking-wider text-white">ANI<span class="text-amber-gold">REALM</span></span>
                </div>

                <!-- Live Search Bar (Desktop) -->
                <div class="hidden md:flex flex-1 max-w-md mx-8 relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="searchInput" oninput="debounceSearch()" placeholder="Rechercher en direct via Jikan API (MAL)..." 
                           class="w-full bg-dark-card border border-dark-border rounded-full py-2.5 pl-11 pr-10 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-amber-gold transition">
                    <button id="searchSpinner" class="hidden absolute right-4 top-1/2 -translate-y-1/2 text-amber-gold animate-spin">
                        <i class="fa-solid fa-circle-notch"></i>
                    </button>
                </div>

                <!-- Navigation Controls -->
                <div class="flex items-center gap-4">
                    <nav class="hidden lg:flex items-center gap-6 text-sm font-bold text-gray-300">
                        <a href="#hero" class="hover:text-amber-gold transition">À la une</a>
                        <a href="#catalog" class="hover:text-amber-gold transition">Tendance</a>
                        <a href="#catalog" onclick="setGenreFilter('Action')" class="hover:text-amber-gold transition">Action</a>
                    </nav>
                    <button onclick="toggleFavoritesModal()" class="relative p-2.5 rounded-full bg-dark-card border border-dark-border hover:border-amber-gold text-gray-300 hover:text-amber-gold transition">
                        <i class="fa-solid fa-bookmark text-lg"></i>
                        <span id="favBadge" class="hidden absolute -top-1 -right-1 bg-amber-gold text-black text-xs font-black w-5 h-5 rounded-full flex items-center justify-center shadow">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- HERO CAROUSEL -->
    <section id="hero" class="relative w-full h-[550px] sm:h-[620px] overflow-hidden bg-dark-card border-b border-dark-border">
        <div id="heroContainer" class="w-full h-full relative">
            <div class="w-full h-full flex items-center justify-center text-amber-gold gap-3">
                <i class="fa-solid fa-circle-notch animate-spin text-3xl"></i>
                <span class="font-bold">Chargement des tendances en direct...</span>
            </div>
        </div>

        <div class="absolute bottom-6 right-6 sm:bottom-10 sm:right-12 z-20 flex items-center gap-3">
            <button onclick="prevHero()" class="w-12 h-12 rounded-full bg-dark-card/90 border border-dark-border hover:border-amber-gold text-white flex items-center justify-center backdrop-blur-sm transition">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button onclick="nextHero()" class="w-12 h-12 rounded-full bg-dark-card/90 border border-dark-border hover:border-amber-gold text-white flex items-center justify-center backdrop-blur-sm transition">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </section>

    <!-- MAIN CONTENT -->
    <main id="catalog" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-10 flex-grow w-full">

        <div class="md:hidden relative w-full">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="mobileSearchInput" oninput="debounceSearchMobile()" placeholder="Rechercher un anime..." 
                   class="w-full bg-dark-card border border-dark-border rounded-full py-2.5 pl-11 pr-4 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-amber-gold">
        </div>

        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border-b border-dark-border pb-6">
            <div class="flex items-center gap-2 overflow-x-auto w-full sm:w-auto pb-2 sm:pb-0 no-scrollbar" id="genreFilters"></div>
            
            <div class="flex items-center gap-3 text-sm text-gray-400 w-full sm:w-auto justify-end">
                <span class="font-semibold whitespace-nowrap">Trier par:</span>
                <select id="sortBy" onchange="applySorting()" class="bg-dark-card border border-dark-border rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-gold">
                    <option value="score">Note MAL (Haute à Basse)</option>
                    <option value="popularity">Popularité</option>
                    <option value="title">Titre (A-Z)</option>
                </select>
            </div>
        </div>

        <section>
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-2xl sm:text-3xl font-black text-white flex items-center gap-3">
                    <span class="w-2.5 h-8 bg-amber-gold rounded-full"></span>
                    <span id="sectionTitle">Top Animes Tendances</span>
                </h2>
                <span id="resultCount" class="text-sm font-bold text-amber-gold/80 bg-amber-gold/10 px-3 py-1 rounded-full border border-amber-gold/20">0 résultats</span>
            </div>

            <div id="animeGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
        </section>

    </main>

    <!-- ANIME DETAIL MODAL -->
    <div id="animeModal" class="fixed inset-0 z-50 hidden bg-black/85 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
        <div class="relative bg-dark-card border border-dark-border rounded-2xl max-w-4xl w-full overflow-hidden shadow-2xl my-8">
            <button onclick="closeModal()" class="absolute top-4 right-4 z-30 w-10 h-10 rounded-full bg-black/70 text-white flex items-center justify-center hover:bg-amber-gold hover:text-black transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- FAVORITES MODAL -->
    <div id="favModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md flex justify-end">
        <div class="bg-dark-card border-l border-dark-border w-full max-w-md h-full p-6 overflow-y-auto flex flex-col justify-between">
            <div>
                <div class="flex items-center justify-between pb-6 border-b border-dark-border mb-6">
                    <h3 class="text-xl font-extrabold text-white flex items-center gap-2">
                        <i class="fa-solid fa-bookmark text-amber-gold"></i> Ma Liste d'Envies
                    </h3>
                    <button onclick="toggleFavoritesModal()" class="text-gray-400 hover:text-white">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
                <div id="favoritesList" class="space-y-4"></div>
            </div>
            <button onclick="clearFavorites()" class="w-full mt-6 py-3 rounded-xl bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white font-bold transition border border-red-500/20">
                Vider ma liste
            </button>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-dark-card border-t border-dark-border py-8 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center sm:flex sm:justify-between sm:items-center text-sm text-gray-500">
            <p>© 2026 AniRealm - Alimenté en direct par MyAnimeList (Jikan API v4).</p>
            <div class="flex justify-center gap-6 mt-4 sm:mt-0">
                <a href="#" class="hover:text-amber-gold">Mentions Légales</a>
                <a href="#" class="hover:text-amber-gold">API Jikan</a>
                <a href="#" class="hover:text-amber-gold">Contact</a>
            </div>
        </div>
    </footer>

    <script>
        const JIKAN_API_BASE = 'https://api.jikan.moe/v4';

        let topAnimes = [];
        let displayedAnimes = [];
        let activeHeroIndex = 0;
        let selectedGenre = "Tous";
        let searchTimeout = null;
        let favorites = JSON.parse(localStorage.getItem('aniRealm_jikan_favs')) || [];

        const GENRE_LIST = ["Tous", "Action", "Aventure", "Fantastique", "Surnaturel", "Sci-Fi", "Comédie", "Drame"];

        window.onload = function() {
            renderGenreFilters();
            fetchTopAnimes();
            updateFavoritesBadge();

            setInterval(() => {
                if (topAnimes.length > 0) {
                    nextHero();
                }
            }, 8000);
        };

        async function fetchTopAnimes() {
            try {
                showGridLoading();
                const response = await fetch(`${JIKAN_API_BASE}/top/anime?limit=25`);
                const data = await response.json();
                
                if (data && data.data) {
                    topAnimes = data.data.map(formatAnimeData);
                    displayedAnimes = [...topAnimes];
                    
                    renderHero();
                    applySorting();
                }
            } catch (error) {
                console.error("Erreur de chargement Jikan API:", error);
                document.getElementById('animeGrid').innerHTML = `
                    <div class="col-span-full text-center py-12 text-red-400">
                        <i class="fa-solid fa-triangle-exclamation text-3xl mb-3"></i>
                        <p>Impossible de charger les données. Veuillez réessayer dans quelques instants.</p>
                    </div>
                `;
            }
        }

        function formatAnimeData(item) {
            return {
                id: item.mal_id,
                title: item.title_japanese || item.title || "Titre Inconnu",
                englishTitle: item.title_english || item.title,
                poster: item.images?.webp?.large_image_url || item.images?.jpg?.large_image_url || 'https://placehold.co/400x600/14141B/FFB703?text=Sans+Image',
                banner: item.trailer?.images?.maximum_image_url || item.images?.webp?.large_image_url || item.images?.jpg?.large_image_url,
                score: item.score || 'N/A',
                rank: item.rank || 'N/A',
                episodes: item.episodes || 'En cours',
                year: item.year || (item.aired?.from ? new Date(item.aired.from).getFullYear() : 'N/A'),
                status: item.status || 'Inconnu',
                genres: item.genres ? item.genres.map(g => g.name) : [],
                synopsis: item.synopsis || "Aucun synopsis disponible pour cet anime.",
                studio: item.studios && item.studios.length > 0 ? item.studios[0].name : "Studio Inconnu",
                trailerEmbed: item.trailer?.embed_url || null,
                url: item.url
            };
        }

        function renderHero() {
            if (topAnimes.length === 0) return;
            const anime = topAnimes[activeHeroIndex];
            const isFav = isFavorite(anime.id);
            const container = document.getElementById('heroContainer');

            container.innerHTML = `
                <div class="absolute inset-0 bg-cover bg-center transition-all duration-700 transform scale-105 filter brightness-90" 
                     style="background-image: url('${anime.banner}');">
                </div>
                <div class="absolute inset-0 hero-gradient"></div>
                <div class="relative max-w-7xl mx-auto h-full px-4 sm:px-6 lg:px-8 flex items-end pb-12 sm:pb-16 z-10">
                    <div class="max-w-2xl space-y-4">
                        <div class="flex items-center gap-3 flex-wrap">
                            <span class="px-3 py-1 bg-amber-gold text-black text-xs font-black rounded-full uppercase tracking-wider shadow">🔥 N°${anime.rank} MAL</span>
                            <span class="text-amber-gold font-bold text-sm bg-black/60 px-2.5 py-1 rounded-md backdrop-blur-md">
                                <i class="fa-solid fa-star"></i> ${anime.score}/10
                            </span>
                            <span class="text-gray-300 text-sm font-semibold bg-black/60 px-2.5 py-1 rounded-md backdrop-blur-md">${anime.studio}</span>
                            <span class="text-gray-400 text-sm font-semibold">• ${anime.year}</span>
                        </div>
                        <h1 class="text-3xl sm:text-5xl font-black text-white leading-tight drop-shadow-lg">
                            ${anime.englishTitle}
                        </h1>
                        <p class="text-gray-300 text-sm sm:text-base line-clamp-3 leading-relaxed drop-shadow">
                            ${anime.synopsis}
                        </p>
                        <div class="flex items-center gap-4 pt-3">
                            <button onclick="openModal(${anime.id})" class="px-6 py-3 rounded-xl bg-amber-gold hover:bg-yellow-400 text-black font-extrabold flex items-center gap-2 transition shadow-lg shadow-amber-gold/20">
                                <i class="fa-solid fa-play"></i> Découvrir
                            </button>
                            <button onclick="toggleFavorite(${anime.id})" class="px-5 py-3 rounded-xl bg-dark-card/90 border border-dark-border hover:border-amber-gold text-white font-bold flex items-center gap-2 backdrop-blur-sm transition">
                                <i class="fa-${isFav ? 'solid' : 'regular'} fa-bookmark ${isFav ? 'text-amber-gold' : ''}"></i> 
                                ${isFav ? 'Dans ma liste' : 'Ajouter à ma liste'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function nextHero() {
            if (topAnimes.length === 0) return;
            activeHeroIndex = (activeHeroIndex + 1) % Math.min(topAnimes.length, 10);
            renderHero();
        }

        function prevHero() {
            if (topAnimes.length === 0) return;
            activeHeroIndex = (activeHeroIndex - 1 + Math.min(topAnimes.length, 10)) % Math.min(topAnimes.length, 10);
            renderHero();
        }

        function renderGenreFilters() {
            const filterContainer = document.getElementById('genreFilters');
            filterContainer.innerHTML = GENRE_LIST.map(genre => `
                <button onclick="setGenreFilter('${genre}')" 
                        class="px-4 py-2 rounded-xl text-sm font-bold transition whitespace-nowrap ${selectedGenre === genre ? 'bg-amber-gold text-black shadow-lg shadow-amber-gold/20' : 'bg-dark-card border border-dark-border text-gray-300 hover:border-amber-gold'}">
                    ${genre}
                </button>
            `).join('');
        }

        function setGenreFilter(genre) {
            selectedGenre = genre;
            renderGenreFilters();
            applySorting();
        }

        function debounceSearch() {
            const spinner = document.getElementById('searchSpinner');
            spinner.classList.remove('hidden');
            
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(async () => {
                const query = document.getElementById('searchInput').value.trim();
                await executeSearch(query);
                spinner.classList.add('hidden');
            }, 500);
        }

        function debounceSearchMobile() {
            const query = document.getElementById('mobileSearchInput').value.trim();
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(async () => {
                await executeSearch(query);
            }, 500);
        }

        async function executeSearch(query) {
            if (!query) {
                document.getElementById('sectionTitle').innerText = "Top Animes Tendances";
                displayedAnimes = [...topAnimes];
                applySorting();
                return;
            }

            document.getElementById('sectionTitle').innerText = `Résultats pour "${query}"`;
            showGridLoading();

            try {
                const response = await fetch(`${JIKAN_API_BASE}/anime?q=${encodeURIComponent(query)}&limit=20`);
                const data = await response.json();

                if (data && data.data) {
                    displayedAnimes = data.data.map(formatAnimeData);
                    applySorting();
                }
            } catch (err) {
                console.error("Erreur de recherche Jikan:", err);
            }
        }

        function applySorting() {
            const sortBy = document.getElementById('sortBy').value;
            let filtered = [...displayedAnimes];

            if (selectedGenre !== "Tous") {
                filtered = filtered.filter(a => a.genres.includes(selectedGenre));
            }

            if (sortBy === "score") {
                filtered.sort((a, b) => (parseFloat(b.score) || 0) - (parseFloat(a.score) || 0));
            } else if (sortBy === "popularity") {
                filtered.sort((a, b) => (parseInt(a.rank) || 9999) - (parseInt(b.rank) || 9999));
            } else if (sortBy === "title") {
                filtered.sort((a, b) => a.englishTitle.localeCompare(b.englishTitle));
            }

            renderGrid(filtered);
        }

        function showGridLoading() {
            const grid = document.getElementById('animeGrid');
            grid.innerHTML = Array(10).fill(0).map(() => `
                <div class="bg-dark-card border border-dark-border rounded-2xl overflow-hidden animate-pulse h-80 flex flex-col justify-between p-4">
                    <div class="bg-dark-border w-full h-48 rounded-xl mb-4"></div>
                    <div class="bg-dark-border h-4 w-3/4 rounded mb-2"></div>
                    <div class="bg-dark-border h-3 w-1/2 rounded"></div>
                </div>
            `).join('');
        }

        function renderGrid(animes) {
            const grid = document.getElementById('animeGrid');
            const count = document.getElementById('resultCount');
            count.innerText = `${animes.length} résultat${animes.length > 1 ? 's' : ''}`;

            if (animes.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16 text-gray-500">
                        <i class="fa-solid fa-ghost text-4xl mb-3 text-amber-gold/50"></i>
                        <p class="text-lg font-bold">Aucun anime trouvé.</p>
                        <p class="text-xs text-gray-600 mt-1">Essayez un autre mot-clé ou modifiez le filtre de genre.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = animes.map(anime => {
                const isFav = isFavorite(anime.id);
                return `
                    <div class="group relative bg-dark-card border border-dark-border rounded-2xl overflow-hidden hover:border-amber-gold/50 transition-all duration-300 hover:-translate-y-1.5 shadow-xl flex flex-col justify-between card-glow">
                        <div class="relative aspect-[2/3] overflow-hidden bg-dark-hover cursor-pointer" onclick="openModal(${anime.id})">
                            <img src="${anime.poster}" alt="${anime.englishTitle}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
                            
                            <div class="absolute top-3 right-3 bg-black/80 backdrop-blur-md px-2.5 py-1 rounded-lg text-xs font-black text-amber-gold flex items-center gap-1 shadow">
                                <i class="fa-solid fa-star"></i> ${anime.score}
                            </div>

                            <button onclick="event.stopPropagation(); toggleFavorite(${anime.id})" class="absolute top-3 left-3 w-8 h-8 rounded-lg bg-black/80 backdrop-blur-md text-white flex items-center justify-center hover:text-amber-gold transition shadow">
                                <i class="fa-${isFav ? 'solid text-amber-gold' : 'regular'} fa-bookmark"></i>
                            </button>
                        </div>

                        <div class="p-4 flex-grow flex flex-col justify-between">
                            <div>
                                <div class="flex items-center gap-2 text-[11px] text-amber-gold font-bold mb-1 uppercase tracking-wider">
                                    <span>${anime.studio}</span>
                                    <span>•</span>
                                    <span>${anime.year}</span>
                                </div>
                                <h3 class="font-bold text-white text-sm sm:text-base line-clamp-1 group-hover:text-amber-gold transition cursor-pointer" onclick="openModal(${anime.id})">
                                    ${anime.englishTitle}
                                </h3>
                                <p class="text-xs text-gray-400 mt-1 line-clamp-2 leading-relaxed">${anime.synopsis}</p>
                            </div>
                            
                            <button onclick="openModal(${anime.id})" class="w-full mt-4 py-2 rounded-xl bg-dark-hover border border-dark-border text-gray-200 text-xs font-extrabold hover:bg-amber-gold hover:text-black hover:border-amber-gold transition">
                                Fiche complète
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openModal(malId) {
            const anime = displayedAnimes.find(a => a.id === malId) || topAnimes.find(a => a.id === malId) || favorites.find(a => a.id === malId);
            if (!anime) return;

            const isFav = isFavorite(anime.id);
            const modal = document.getElementById('animeModal');
            const content = document.getElementById('modalContent');

            content.innerHTML = `
                <div class="relative h-64 sm:h-80 bg-cover bg-center" style="background-image: url('${anime.banner}')">
                    <div class="absolute inset-0 bg-gradient-to-t from-dark-card via-dark-card/60 to-transparent"></div>
                </div>
                
                <div class="p-6 sm:p-8 -mt-24 relative z-10 space-y-6">
                    <div class="flex flex-col sm:flex-row gap-6 items-start">
                        <img src="${anime.poster}" alt="${anime.englishTitle}" class="w-36 sm:w-44 rounded-2xl border-2 border-amber-gold/40 shadow-2xl flex-shrink-0 object-cover">
                        
                        <div class="space-y-3 flex-1">
                            <div class="flex items-center gap-2 flex-wrap">
                                ${anime.genres.map(g => `<span class="px-2.5 py-0.5 rounded-full bg-amber-gold/10 text-amber-gold text-xs font-bold border border-amber-gold/20">${g}</span>`).join('')}
                            </div>
                            <h2 class="text-2xl sm:text-4xl font-black text-white leading-tight">${anime.englishTitle}</h2>
                            <p class="text-sm text-gray-400 font-semibold">${anime.title} • Studio: ${anime.studio}</p>
                            
                            <div class="flex items-center gap-4 text-sm pt-1 text-gray-300 flex-wrap">
                                <span class="bg-dark-hover border border-dark-border px-3 py-1 rounded-lg"><i class="fa-solid fa-star text-amber-gold"></i> <strong class="text-white">${anime.score}</strong>/10</span>
                                <span class="bg-dark-hover border border-dark-border px-3 py-1 rounded-lg"><i class="fa-solid fa-tv text-purple-400"></i> ${anime.episodes} épisodes</span>
                                <span class="bg-dark-hover border border-dark-border px-3 py-1 rounded-lg"><i class="fa-solid fa-signal text-emerald-400"></i> ${anime.status}</span>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-2 border-t border-dark-border pt-4">
                        <h4 class="text-xs font-black text-amber-gold uppercase tracking-wider">Synopsis Officiel</h4>
                        <p class="text-gray-300 text-sm sm:text-base leading-relaxed">${anime.synopsis}</p>
                    </div>

                    ${anime.trailerEmbed ? `
                        <div class="space-y-2 border-t border-dark-border pt-4">
                            <h4 class="text-xs font-black text-amber-gold uppercase tracking-wider">Bande-Annonce Officielle</h4>
                            <div class="aspect-video w-full rounded-2xl overflow-hidden border border-dark-border bg-black">
                                <iframe src="${anime.trailerEmbed}" class="w-full h-full" frameborder="0" allowfullscreen></iframe>
                            </div>
                        </div>
                    ` : ''}

                    <div class="flex items-center gap-4 pt-4 border-t border-dark-border">
                        <a href="${anime.url}" target="_blank" rel="noopener" class="flex-1 py-3.5 rounded-xl bg-amber-gold hover:bg-yellow-400 text-black font-extrabold text-center transition flex items-center justify-center gap-2 shadow-lg shadow-amber-gold/20">
                            <i class="fa-solid fa-external-link"></i> Voir sur MyAnimeList
                        </a>
                        <button onclick="toggleFavorite(${anime.id}); openModal(${anime.id});" class="px-5 py-3.5 rounded-xl bg-dark-hover border border-dark-border hover:border-amber-gold text-white font-bold transition flex items-center gap-2">
                            <i class="fa-${isFav ? 'solid text-amber-gold' : 'regular'} fa-bookmark"></i>
                            <span>${isFav ? 'Sauvegardé' : 'Ajouter'}</span>
                        </button>
                    </div>
                </div>
            `;

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('animeModal').classList.add('hidden');
        }

        function isFavorite(id) {
            return favorites.some(fav => fav.id === id);
        }

        function toggleFavorite(id) {
            const anime = displayedAnimes.find(a => a.id === id) || topAnimes.find(a => a.id === id) || favorites.find(a => a.id === id);
            if (!anime) return;

            if (isFavorite(id)) {
                favorites = favorites.filter(fav => fav.id !== id);
            } else {
                favorites.push(anime);
            }

            localStorage.setItem('aniRealm_jikan_favs', JSON.stringify(favorites));
            updateFavoritesBadge();
            renderFavoritesList();
            applySorting();
            renderHero();
        }

        function updateFavoritesBadge() {
            const badge = document.getElementById('favBadge');
            badge.innerText = favorites.length;
            if (favorites.length > 0) {
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function toggleFavoritesModal() {
            const modal = document.getElementById('favModal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                renderFavoritesList();
            }
        }

        function renderFavoritesList() {
            const list = document.getElementById('favoritesList');
            if (favorites.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <i class="fa-regular fa-bookmark text-3xl mb-2 text-gray-600"></i>
                        <p class="text-sm">Votre liste est vide.</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = favorites.map(anime => `
                <div class="flex items-center gap-4 bg-dark-hover p-3 rounded-xl border border-dark-border">
                    <img src="${anime.poster}" alt="${anime.englishTitle}" class="w-12 h-16 object-cover rounded-lg">
                    <div class="flex-1 min-w-0">
                        <h4 class="text-sm font-bold text-white truncate cursor-pointer hover:text-amber-gold" onclick="openModal(${anime.id}); toggleFavoritesModal();">${anime.englishTitle}</h4>
                        <p class="text-xs text-amber-gold font-semibold"><i class="fa-solid fa-star"></i> ${anime.score}</p>
                    </div>
                    <button onclick="toggleFavorite(${anime.id})" class="text-gray-400 hover:text-red-400 p-2">
                        <i class="fa-solid fa-trash text-sm"></i>
                    </button>
                </div>
            `).join('');
        }

        function clearFavorites() {
            favorites = [];
            localStorage.removeItem('aniRealm_jikan_favs');
            updateFavoritesBadge();
            renderFavoritesList();
            applySorting();
            renderHero();
        }

        function resetToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.getElementById('searchInput').value = '';
            document.getElementById('mobileSearchInput').value = '';
            document.getElementById('sectionTitle').innerText = "Top Animes Tendances";
            selectedGenre = "Tous";
            renderGenreFilters();
            displayedAnimes = [...topAnimes];
            applySorting();
        }
    </script>
</body>
</html>
