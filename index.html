<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AniShop - Top Animes & Boutique Manga</title>
  <style>
    /* RESET & THEME DARK MANGA */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      padding-bottom: 60px;
    }

    /* NAVIGATION HEADER */
    header {
      background-color: #151c2c;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 2px solid #38bdf8;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    nav a {
      color: #94a3b8;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #38bdf8;
    }

    .cart-btn-nav {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s;
    }

    .cart-btn-nav:hover {
      transform: scale(1.05);
    }

    /* CONTAINER PRINCIPAL */
    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .search-box {
      width: 100%;
      margin-bottom: 2rem;
      display: flex;
      justify-content: center;
    }

    .search-input {
      width: 100%;
      max-width: 600px;
      padding: 0.8rem 1.2rem;
      border-radius: 25px;
      border: 2px solid #334155;
      background-color: #151c2c;
      color: white;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: #38bdf8;
    }

    h2 {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      border-left: 5px solid #38bdf8;
      padding-left: 0.8rem;
      margin-top: 2rem;
    }

    /* CLASSEMENT ANIMES (AVEC AFFICHE) */
    .ranking-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-height: 550px;
      overflow-y: auto;
      padding-right: 0.5rem;
    }

    .ranking-item {
      background-color: #151c2c;
      padding: 0.8rem 1.2rem;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 1.2rem;
      border: 1px solid #1e293b;
      transition: transform 0.2s, background-color 0.2s;
    }

    .ranking-item:hover {
      background-color: #1e293b;
      transform: translateX(5px);
    }

    .rank {
      font-size: 1.4rem;
      font-weight: 800;
      color: #f59e0b;
      min-width: 45px;
    }

    .anime-poster {
      width: 50px;
      height: 70px;
      object-fit: cover;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .anime-info-text {
      flex-grow: 1;
    }

    .anime-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #f8fafc;
    }

    .anime-genre {
      font-size: 0.85rem;
      color: #64748b;
    }

    .rating {
      background-color: #0f172a;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-weight: bold;
      color: #38bdf8;
      border: 1px solid #334155;
    }

    /* BOUTIQUE MANGAS */
    .manga-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
    }

    .manga-card {
      background-color: #151c2c;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #1e293b;
      transition: transform 0.2s;
    }

    .manga-card:hover {
      transform: translateY(-6px);
      border-color: #38bdf8;
    }

    .manga-cover-img {
      width: 100%;
      height: 280px;
      object-fit: cover;
    }

    .manga-info {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .manga-title {
      font-size: 1.05rem;
      font-weight: bold;
    }

    .manga-price {
      font-size: 1.25rem;
      color: #4ade80;
      font-weight: 800;
    }

    .btn-add {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 0.7rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .btn-add:hover {
      background-color: #0369a1;
    }

    /* SECTON PANIER */
    .cart-section {
      background-color: #151c2c;
      border-radius: 12px;
      padding: 1.5rem;
      margin-top: 3rem;
      border: 1px solid #1e293b;
    }

    .cart-items {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-bottom: 1.5rem;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #0b0f19;
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
    }

    .cart-total {
      font-size: 1.4rem;
      font-weight: bold;
      text-align: right;
      color: #4ade80;
      margin-bottom: 1rem;
    }

    .cart-actions {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
    }

    .btn-danger {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-success {
      background-color: #22c55e;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">AniShop ⛩️</div>
    <nav>
      <a href="#ranking">Classement</a>
      <a href="#shop">Boutique Manga</a>
      <a href="#cart" class="cart-btn-nav">🛒 Panier (<span id="cart-count">0</span>)</a>
    </nav>
  </header>

  <div class="container">

    <!-- RECHERCHE -->
    <div class="search-box">
      <input type="text" id="search-input" class="search-input" placeholder="🔍 Rechercher un anime ou un manga..." oninput="filterContent()">
    </div>

    <!-- CLASSEMENT ANIMES -->
    <section id="ranking">
      <h2>🏆 Top Classement Animes</h2>
      <div class="ranking-list" id="ranking-list">
        <!-- Rempli en JS -->
      </div>
    </section>

    <!-- BOUTIQUE MANGAS -->
    <section id="shop">
      <h2>📚 Boutique Mangas</h2>
      <div class="manga-grid" id="manga-grid">
        <!-- Rempli en JS -->
      </div>
    </section>

    <!-- PANIER -->
    <section id="cart" class="cart-section">
      <h2>🛒 Mon Panier</h2>
      <div class="cart-items" id="cart-items">
        <p style="color: #94a3b8;">Votre panier est vide pour le moment.</p>
      </div>
      <div class="cart-total">Total : <span id="cart-total-price">0.00</span> €</div>
      <div class="cart-actions">
        <button class="btn-danger" onclick="clearCart()">Vider le panier</button>
        <button class="btn-success" onclick="checkout()">Commander</button>
      </div>
    </section>

  </div>

  <script>
    // 1. DONNÉES ANIMES AVEC VRAIS VISUELS (Vrais liens CDN MyAnimeList)
    const animes = [
      { rank: 1, title: "Frieren: Beyond Journey's End", genre: "Aventure, Fantasy", note: "9.3/10", image: "https://cdn.myanimelist.net/images/anime/1015/138006.jpg" },
      { rank: 2, title: "Fullmetal Alchemist: Brotherhood", genre: "Action, Fantasy", note: "9.1/10", image: "https://cdn.myanimelist.net/images/anime/1208/94745.jpg" },
      { rank: 3, title: "Attack on Titan (Shingeki no Kyojin)", genre: "Action, Drame", note: "9.0/10", image: "https://cdn.myanimelist.net/images/anime/10/47347.jpg" },
      { rank: 4, title: "Bleach: Thousand-Year Blood War", genre: "Action, Surnaturel", note: "8.9/10", image: "https://cdn.myanimelist.net/images/anime/1908/120036.jpg" },
      { rank: 5, title: "Demon Slayer (Kimetsu no Yaiba)", genre: "Action, Démons", note: "8.7/10", image: "https://cdn.myanimelist.net/images/anime/1286/99889.jpg" },
      { rank: 6, title: "Jujutsu Kaisen", genre: "Action, Occulte", note: "8.6/10", image: "https://cdn.myanimelist.net/images/anime/1171/109222.jpg" },
      { rank: 7, title: "Hunter x Hunter (2011)", genre: "Aventure, Shonen", note: "8.6/10", image: "https://cdn.myanimelist.net/images/anime/13/33465.jpg" },
      { rank: 8, title: "One Piece", genre: "Aventure, Pirates", note: "8.5/10", image: "https://cdn.myanimelist.net/images/anime/1244/138851.jpg" },
      { rank: 9, title: "Chainsaw Man", genre: "Action, Surnaturel", note: "8.4/10", image: "https://cdn.myanimelist.net/images/anime/1806/126216.jpg" },
      { rank: 10, title: "Vinland Saga", genre: "Historique, Action", note: "8.7/10", image: "https://cdn.myanimelist.net/images/anime/1500/103000.jpg" }
    ];

    // 2. DONNÉES BOUTIQUE MANGAS AVEC COUVERTURES OFFICIELLES
    const mangas = [
      { id: 1, title: "One Piece - Tome 100", price: 6.99, image: "https://cdn.myanimelist.net/images/manga/2/253146.jpg" },
      { id: 2, title: "Jujutsu Kaisen - Tome 01", price: 6.95, image: "https://cdn.myanimelist.net/images/manga/3/210341.jpg" },
      { id: 3, title: "Chainsaw Man - Tome 01", price: 7.20, image: "https://cdn.myanimelist.net/images/manga/3/216464.jpg" },
      { id: 4, title: "Spy x Family - Tome 01", price: 6.95, image: "https://cdn.myanimelist.net/images/manga/3/219741.jpg" },
      { id: 5, title: "Demon Slayer - Tome 01", price: 6.99, image: "https://cdn.myanimelist.net/images/manga/3/179023.jpg" },
      { id: 6, title: "My Hero Academia - Tome 01", price: 6.90, image: "https://cdn.myanimelist.net/images/manga/1/157897.jpg" },
      { id: 7, title: "Berserk - Tome 01", price: 8.90, image: "https://cdn.myanimelist.net/images/manga/1/157897.jpg" },
      { id: 8, title: "Tokyo Revengers - Tome 01", price: 6.90, image: "https://cdn.myanimelist.net/images/manga/2/206259.jpg" }
    ];

    let cart = [];

    // Affichage des animes
    function displayRanking(items = animes) {
      const container = document.getElementById('ranking-list');
      container.innerHTML = '';
      items.forEach(anime => {
        container.innerHTML += `
          <div class="ranking-item">
            <span class="rank">#${anime.rank}</span>
            <img class="anime-poster" src="${anime.image}" alt="${anime.title}">
            <div class="anime-info-text">
              <div class="anime-title">${anime.title}</div>
              <div class="anime-genre">${anime.genre}</div>
            </div>
            <span class="rating">⭐ ${anime.note}</span>
          </div>
        `;
      });
    }

    // Affichage des mangas
    function displayShop(items = mangas) {
      const container = document.getElementById('manga-grid');
      container.innerHTML = '';
      items.forEach(manga => {
        container.innerHTML += `
          <div class="manga-card">
            <img class="manga-cover-img" src="${manga.image}" alt="${manga.title}">
            <div class="manga-info">
              <div class="manga-title">${manga.title}</div>
              <div class="manga-price">${manga.price.toFixed(2)} €</div>
              <button class="btn-add" onclick="addToCart(${manga.id})">Ajouter au panier</button>
            </div>
          </div>
        `;
      });
    }

    // Filtre avec la barre de recherche
    function filterContent() {
      const query = document.getElementById('search-input').value.toLowerCase();
      
      const filteredAnimes = animes.filter(a => a.title.toLowerCase().includes(query) || a.genre.toLowerCase().includes(query));
      const filteredMangas = mangas.filter(m => m.title.toLowerCase().includes(query));

      displayRanking(filteredAnimes);
      displayShop(filteredMangas);
    }

    // Gestion du panier
    function addToCart(mangaId) {
      const manga = mangas.find(m => m.id === mangaId);
      cart.push(manga);
      updateCart();
    }

    function updateCart() {
      const cartItemsContainer = document.getElementById('cart-items');
      const cartCount = document.getElementById('cart-count');
      const cartTotalPrice = document.getElementById('cart-total-price');

      cartCount.innerText = cart.length;

      if (cart.length === 0) {
        cartItemsContainer.innerHTML = '<p style="color: #94a3b8;">Votre panier est vide pour le moment.</p>';
        cartTotalPrice.innerText = '0.00';
        return;
      }

      cartItemsContainer.innerHTML = '';
      let total = 0;

      cart.forEach((item) => {
        total += item.price;
        cartItemsContainer.innerHTML += `
          <div class="cart-item">
            <span>${item.title}</span>
            <span><strong>${item.price.toFixed(2)} €</strong></span>
          </div>
        `;
      });

      cartTotalPrice.innerText = total.toFixed(2);
    }

    function clearCart() {
      cart = [];
      updateCart();
    }

    function checkout() {
      if (cart.length === 0) {
        alert("Votre panier est vide !");
      } else {
        alert("Merci pour votre commande ! (Démonstration)");
        clearCart();
      }
    }

    // Démarrage
    displayRanking();
    displayShop();
  </script>

</body>
</html>
