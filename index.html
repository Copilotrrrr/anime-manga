<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AniShop - Top 50 Animes & Boutique Manga</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding-bottom: 60px;
    }

    /* NAVIGATION */
    header {
      background-color: #1e293b;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #38bdf8;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    nav a {
      color: #94a3b8;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #38bdf8;
    }

    .cart-btn-nav {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    /* RECHERCHE ET FILTRES */
    .controls-section {
      background-color: #1e293b;
      padding: 1.5rem;
      border-radius: 10px;
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      border: 1px solid #334155;
    }

    .search-input {
      width: 100%;
      padding: 0.8rem 1rem;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #f8fafc;
      font-size: 1rem;
    }

    .search-input:focus {
      outline: 2px solid #38bdf8;
    }

    .filter-tags {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background-color: #0f172a;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .filter-btn.active, .filter-btn:hover {
      background-color: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }

    h2 {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      border-left: 4px solid #38bdf8;
      padding-left: 0.75rem;
      margin-top: 2rem;
    }

    /* CLASSEMENT ANIMES */
    .ranking-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      max-height: 650px;
      overflow-y: auto;
      padding: 1rem;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
    }

    .ranking-item {
      background-color: #1e293b;
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: background-color 0.2s;
    }

    .ranking-item:hover {
      background-color: #334155;
    }

    .rank {
      font-size: 1.2rem;
      font-weight: bold;
      color: #f59e0b;
      width: 40px;
      text-align: center;
    }

    .anime-poster {
      width: 50px;
      height: 70px;
      object-fit: cover;
      border-radius: 4px;
      background-color: #334155;
    }

    .anime-info {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      flex-grow: 1;
    }

    .anime-title {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .anime-genre {
      font-size: 0.8rem;
      background-color: #334155;
      color: #94a3b8;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      width: fit-content;
    }

    .rating {
      background-color: #0f172a;
      padding: 0.4rem 0.8rem;
      border-radius: 15px;
      font-weight: bold;
      color: #38bdf8;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    /* BOUTIQUE MANGA */
    .manga-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
    }

    .manga-card {
      background-color: #1e293b;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #334155;
      transition: transform 0.2s;
    }

    .manga-card:hover {
      transform: translateY(-5px);
    }

    .manga-cover {
      width: 100%;
      height: 280px;
      object-fit: cover;
      background-color: #334155;
    }

    .manga-details {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .manga-title {
      font-size: 1rem;
      font-weight: bold;
    }

    .manga-price {
      font-size: 1.2rem;
      color: #4ade80;
      font-weight: bold;
    }

    .btn-add {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .btn-add:hover {
      background-color: #0369a1;
    }

    /* PANIER */
    .cart-drawer {
      position: fixed;
      top: 0;
      right: -400px;
      width: 380px;
      height: 100%;
      background-color: #1e293b;
      box-shadow: -5px 0 15px rgba(0, 0, 0, 0.5);
      z-index: 200;
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
    }

    .cart-drawer.open {
      right: 0;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 1rem;
      margin-bottom: 1rem;
    }

    .close-cart {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .cart-items {
      flex-grow: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #0f172a;
      padding: 0.8rem;
      border-radius: 6px;
    }

    .cart-item-title {
      font-weight: bold;
      font-size: 0.9rem;
    }

    .cart-item-price {
      color: #4ade80;
      font-size: 0.85rem;
    }

    .btn-remove {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .cart-footer {
      border-top: 1px solid #334155;
      padding-top: 1rem;
      margin-top: 1rem;
    }

    .cart-total {
      font-size: 1.3rem;
      font-weight: bold;
      text-align: right;
      color: #4ade80;
      margin-bottom: 1rem;
    }

    .btn-checkout {
      width: 100%;
      background-color: #22c55e;
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 150;
      display: none;
    }

    .overlay.open {
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">AniShop ⛩️</div>
    <nav>
      <a href="#ranking">Classement</a>
      <a href="#shop">Boutique Manga</a>
      <button class="cart-btn-nav" onclick="toggleCart()">

  <div class="container">

        <button class="filter-btn" onclick="setCategory('Drame', this)">Drame</button>

    </div>

    <section id="ranking">

      <div class="ranking-list" id="ranking-list"></div>
    </section>

    <section id="shop">
      <h2>📚 Boutique Mangas</h2>
      <div class="manga-grid" id="manga-grid"></div>
    </section>

  </div>

  <div class="overlay" id="overlay" onclick="toggleCart()"></div>
  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h3>Mon Panier 🛒</h3>

    <div class="cart-footer">

      <button class="btn-checkout" onclick="checkout()">Commander</button>
    </div>
  </div>

    const mangas = [
      { id: 1, title: "One Piece - Tome 100", price: 6.99, image: "https://cdn.myanimelist.net/images/anime/1244/138851.jpg", category: "Shonen" },
      { id: 2, title: "Jujutsu Kaisen - Tome 01", price: 6.95, image: "https://cdn.myanimelist.net/images/anime/1171/109222.jpg", category: "Dark Fantasy" },

    let cart = [];
    let currentCategory = "Tous";

    function displayRanking(filterText = "") {
      const container = document.getElementById('ranking-list');
      container.innerHTML = '';
      
      const filtered = animes.filter(anime => {
        const matchesSearch = anime.title.toLowerCase().includes(filterText.toLowerCase());
        const matchesCategory = currentCategory === "Tous" || anime.category === currentCategory;
        return matchesSearch && matchesCategory;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<p style="color: #94a3b8; text-align: center; padding: 2rem;">Aucun anime trouvé.</p>';
        return;
      }

      filtered.forEach(anime => {
        container.innerHTML += `
          <div class="ranking-item">
            <span class="rank">#${anime.rank}</span>
            <img class="anime-poster" src="${anime.image}" alt="${anime.title}" onerror="this.src='${fallbackImage}'">
            <div class="anime-info">
              <span class="anime-title">${anime.title}</span>
              <span class="anime-genre">${anime.category}</span>
            </div>
            <span class="rating">⭐ ${anime.note}</span>
          </div>
        `;
      });
    }

    function displayShop(filterText = "") {
      const container = document.getElementById('manga-grid');
      container.innerHTML = '';

      const filtered = mangas.filter(manga => {
        const matchesSearch = manga.title.toLowerCase().includes(filterText.toLowerCase());
        const matchesCategory = currentCategory === "Tous" || manga.category === currentCategory;
        return matchesSearch && matchesCategory;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<p style="color: #94a3b8; grid-column: 1/-1; text-align: center;">Aucun manga trouvé.</p>';
        return;
      }

      filtered.forEach(manga => {
        container.innerHTML += `
          <div class="manga-card">
            <img class="manga-cover" src="${manga.image}" alt="${manga.title}" onerror="this.src='${fallbackImage}'">
            <div class="manga-details">
              <div class="manga-title">${manga.title}</div>
              <div class="manga-price">${manga.price.toFixed(2)} €</div>
              <button class="btn-add" onclick="addToCart(${manga.id})">Ajouter au panier</button>
            </div>
          </div>
        `;
      });
    }

    function addToCart(mangaId) {
      const manga = mangas.find(m => m.id === mangaId);
      cart.push(manga);
      updateCart();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCart();
    }

    function updateCart() {
      const cartItemsContainer = document.getElementById('cart-items');
      const cartCount = document.getElementById('cart-count');
      const cartTotalPrice = document.getElementById('cart-total-price');

      cartCount.innerText = cart.length;

      if (cart.length === 0) {
        cartItemsContainer.innerHTML = '<p style="color: #94a3b8;">Votre panier est vide.</p>';
        cartTotalPrice.innerText = '0.00';
        return;
      }

      cartItemsContainer.innerHTML = '';
      let total = 0;

      cart.forEach((item, index) => {
        total += item.price;
        cartItemsContainer.innerHTML += `
          <div class="cart-item">
            <div>
              <div class="cart-item-title">${item.title}</div>
              <div class="cart-item-price">${item.price.toFixed(2)} €</div>
            </div>
            <button class="btn-remove" onclick="removeFromCart(${index})">Supprimer</button>
          </div>
        `;
      });

      cartTotalPrice.innerText = total.toFixed(2);
    }

    function toggleCart() {
      document.getElementById('cart-drawer').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('open');
    }

    function checkout() {
      if (cart.length === 0) {
        alert("Votre panier est vide !");
      } else {
        alert("Merci pour votre commande !");
        cart = [];
        updateCart();
        toggleCart();
      }
    }

    function filterData() {
      const query = document.getElementById('search-bar').value;
      displayRanking(query);
      displayShop(query);
    }

    function setCategory(category, btn) {
      currentCategory = category;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterData();
    }

    displayRanking();
    displayShop();
  </script>
</body>
</html>
