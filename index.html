<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AniShop - Top Animes & Boutique Manga</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding-bottom: 60px;
    }

    /* Navigation */
    header {
      background-color: #1e293b;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #38bdf8;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    nav a {
      color: #94a3b8;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #38bdf8;
    }

    .cart-btn-nav {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Layout principal */
    container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
      display: block;
    }

    h2 {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      border-left: 4px solid #38bdf8;
      padding-left: 0.75rem;
      margin-top: 2rem;
    }

    /* Section Classement */
    .ranking-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      max-height: 500px;
      overflow-y: auto;
      padding-right: 0.5rem;
    }

    .ranking-item {
      background-color: #1e293b;
      padding: 1rem 1.2rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.2s, background-color 0.2s;
    }

    .ranking-item:hover {
      background-color: #334155;
    }

    .rank {
      font-size: 1.3rem;
      font-weight: bold;
      color: #f59e0b;
      width: 50px;
    }

    .anime-title {
      font-size: 1.05rem;
      flex-grow: 1;
    }

    .rating {
      background-color: #0f172a;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-weight: bold;
      color: #38bdf8;
      font-size: 0.9rem;
    }

    /* Section Boutique */
    .manga-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
    }

    .manga-card {
      background-color: #1e293b;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #334155;
      transition: transform 0.2s;
    }

    .manga-card:hover {
      transform: translateY(-5px);
    }

    .manga-cover {
      width: 100%;
      height: 250px;
      background-color: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 3rem;
    }

    .manga-info {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .manga-title {
      font-size: 1.05rem;
      font-weight: bold;
    }

    .manga-price {
      font-size: 1.2rem;
      color: #4ade80;
      font-weight: bold;
    }

    .btn-add {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .btn-add:hover {
      background-color: #0369a1;
    }

    /* Section Panier */
    .cart-section {
      background-color: #1e293b;
      border-radius: 10px;
      padding: 1.5rem;
      margin-top: 3rem;
      border: 1px solid #334155;
    }

    .cart-items {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #0f172a;
      padding: 0.8rem 1rem;
      border-radius: 6px;
    }

    .cart-total {
      font-size: 1.3rem;
      font-weight: bold;
      text-align: right;
      color: #4ade80;
      margin-bottom: 1rem;
    }

    .cart-actions {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
    }

    .btn-danger {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-success {
      background-color: #22c55e;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">AniShop ⛩️</div>
    <nav>
      <a href="#ranking">Classement</a>
      <a href="#shop">Boutique Manga</a>
      <a href="#cart" class="cart-btn-nav">🛒 Panier (<span id="cart-count">0</span>)</a>
    </nav>
  </header>

  <container>

    <!-- SECTION CLASSEMENT -->
    <section id="ranking">
      <h2>🏆 Top Animes</h2>
      <div class="ranking-list" id="ranking-list">
        <!-- Généré dynamiquement en JS -->
      </div>
    </section>

    <!-- SECTION BOUTIQUE -->
    <section id="shop">
      <h2>📚 Boutique Mangas</h2>
      <div class="manga-grid" id="manga-grid">
        <!-- Généré dynamiquement en JS -->
      </div>
    </section>

    <!-- SECTION PANIER -->
    <section id="cart" class="cart-section">
      <h2>🛒 Mon Panier</h2>
      <div class="cart-items" id="cart-items">
        <p style="color: #94a3b8;">Votre panier est vide pour le moment.</p>
      </div>
      <div class="cart-total">Total : <span id="cart-total-price">0.00</span> €</div>
      <div class="cart-actions">
        <button class="btn-danger" onclick="clearCart()">Vider le panier</button>
        <button class="btn-success" onclick="checkout()">Commander</button>
      </div>
    </section>

  </container>

  <script>
    // --- 1. DONNÉES DES ANIMES (Exemple étendu) ---
    const animes = [
      { rank: 1, title: "Attack on Titan (Shingeki no Kyojin)", note: "9.1/10" },
      { rank: 2, title: "Fullmetal Alchemist: Brotherhood", note: "9.0/10" },
      { rank: 3, title: "Bleach: Thousand-Year Blood War", note: "8.9/10" },
      { rank: 4, title: "Demon Slayer (Kimetsu no Yaiba)", note: "8.7/10" },
      { rank: 5, title: "Jujutsu Kaisen", note: "8.6/10" },
      { rank: 6, title: "Hunter x Hunter (2011)", note: "8.6/10" },
      { rank: 7, title: "One Piece", note: "8.5/10" },
      { rank: 8, title: "Steins;Gate", note: "8.5/10" },
      { rank: 9, title: "Chainsaw Man", note: "8.4/10" },
      { rank: 10, title: "Vinland Saga", note: "8.4/10" }
    ];

    // --- 2. DONNÉES DE LA BOUTIQUE MANGA ---
    const mangas = [
      { id: 1, title: "One Piece - Tome 100", price: 6.99, emoji: "🏴‍☠️" },
      { id: 2, title: "Jujutsu Kaisen - Tome 01", price: 6.95, emoji: "⛩️" },
      { id: 3, title: "Chainsaw Man - Tome 01", price: 7.20, emoji: "🪚" },
      { id: 4, title: "Spy x Family - Tome 01", price: 6.95, emoji: "🕵️" },
      { id: 5, title: "Demon Slayer - Tome 01", price: 6.99, emoji: "⚔️" },
      { id: 6, title: "My Hero Academia - Tome 01", price: 6.90, emoji: "💥" },
      { id: 7, title: "Berserk - Tome 01", price: 8.90, emoji: "🗡️" },
      { id: 8, title: "Tokyo Revengers - Tome 01", price: 6.90, emoji: "👊" }
    ];

    let cart = [];

    // --- AFFICHAGE DU CLASSEMENT ---
    function displayRanking() {
      const container = document.getElementById('ranking-list');
      container.innerHTML = '';
      animes.forEach(anime => {
        container.innerHTML += `
          <div class="ranking-item">
            <span class="rank">#${anime.rank}</span>
            <span class="anime-title">${anime.title}</span>
            <span class="rating">⭐ ${anime.note}</span>
          </div>
        `;
      });
    }

    // --- AFFICHAGE DE LA BOUTIQUE ---
    function displayShop() {
      const container = document.getElementById('manga-grid');
      container.innerHTML = '';
      mangas.forEach(manga => {
        container.innerHTML += `
          <div class="manga-card">
            <div class="manga-cover">${manga.emoji}</div>
            <div class="manga-info">
              <div class="manga-title">${manga.title}</div>
              <div class="manga-price">${manga.price.toFixed(2)} €</div>
              <button class="btn-add" onclick="addToCart(${manga.id})">Ajouter au panier</button>
            </div>
          </div>
        `;
      });
    }

    // --- GESTION DU PANIER ---
    function addToCart(mangaId) {
      const manga = mangas.find(m => m.id === mangaId);
      cart.push(manga);
      updateCart();
    }

    function updateCart() {
      const cartItemsContainer = document.getElementById('cart-items');
      const cartCount = document.getElementById('cart-count');
      const cartTotalPrice = document.getElementById('cart-total-price');

      cartCount.innerText = cart.length;

      if (cart.length === 0) {
        cartItemsContainer.innerHTML = '<p style="color: #94a3b8;">Votre panier est vide pour le moment.</p>';
        cartTotalPrice.innerText = '0.00';
        return;
      }

      cartItemsContainer.innerHTML = '';
      let total = 0;

      cart.forEach((item, index) => {
        total += item.price;
        cartItemsContainer.innerHTML += `
          <div class="cart-item">
            <span>${item.title}</span>
            <span><strong>${item.price.toFixed(2)} €</strong></span>
          </div>
        `;
      });

      cartTotalPrice.innerText = total.toFixed(2);
    }

    function clearCart() {
      cart = [];
      updateCart();
    }

    function checkout() {
      if (cart.length === 0) {
        alert("Votre panier est vide !");
      } else {
        alert("Merci pour votre commande ! (Ceci est une démonstration)");
        clearCart();
      }
    }

    // Initialisation au chargement de la page
    displayRanking();
    displayShop();
  </script>

</body>
</html>
